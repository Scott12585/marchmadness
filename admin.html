<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>

<h2>Admin – Enter Scores</h2>

<select id="roundSelect">
  <option value="1">Round 1</option>
  <option value="2">Round 2</option>
  <option value="3">Sweet 16</option>
  <option value="4">Elite 8</option>
  <option value="5">Final 4</option>
  <option value="6">Championship</option>
</select>

<button onclick="loadGames()">Load Games</button>
<button onclick="processRound()">Process Round</button>

<div id="gamesContainer"></div>

<script>
const supabaseUrl = "https://vlyrdolffrcpaaszjdtv.supabase.co";
const supabaseKey = "sb_publishable_N3lv1OFRTCeRhmuyRMzbAg_D-_mPxPs";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function loadGames() {
  const round = document.getElementById("roundSelect").value;

  const { data, error } = await supabase
    .from("games")
    .select(`
      id,
      spread,
      team1:team1_id(name),
      team2:team2_id(name),
      team1_id,
      team2_id
    `)
    .eq("round", round)
    .order("id");

  if (error) {
    console.error(error);
    return;
  }

  const container = document.getElementById("gamesContainer");
  container.innerHTML = "";

  data.forEach(game => {
    container.innerHTML += `
      <div style="border:1px solid #ccc; padding:15px; margin:10px;">
        <h3>${game.team1.name} vs ${game.team2.name}</h3>
        <p>Spread: ${game.spread} (applies to Team 1)</p>

        <input type="number" id="t1_${game.id}" placeholder="Team 1 Score">
        <input type="number" id="t2_${game.id}" placeholder="Team 2 Score">

        <button onclick="saveGame('${game.id}', '${game.team1_id}', '${game.team2_id}', ${game.spread})">
          Save Game
        </button>
      </div>
    `;
  });
}

async function saveGame(gameId, team1Id, team2Id, spread) {

  const team1Score = parseInt(document.getElementById(`t1_${gameId}`).value);
  const team2Score = parseInt(document.getElementById(`t2_${gameId}`).value);

  if (isNaN(team1Score) || isNaN(team2Score)) {
    alert("Enter both scores");
    return;
  }

  let winnerTeamId = null;
  let coverTeamId = null;

  // Determine winner
  if (team1Score > team2Score) {
    winnerTeamId = team1Id;
  } else {
    winnerTeamId = team2Id;
  }

  // Determine cover
  const adjustedTeam1 = team1Score + spread;

  if (adjustedTeam1 > team2Score) {
    coverTeamId = team1Id;
  } else {
    coverTeamId = team2Id;
  }

  const { error } = await supabase
    .from("games")
    .update({
      team1_score: team1Score,
      team2_score: team2Score,
      winner_team_id: winnerTeamId,
      cover_team_id: coverTeamId
    })
    .eq("id", gameId);

  if (error) {
    console.error(error);
    alert("Error saving game");
    return;
  }

  alert("Game saved successfully");
}

async function processRound() {
  const round = document.getElementById("roundSelect").value;

  const { error } = await supabase.rpc("process_round", {
    round_number: parseInt(round)
  });

  if (error) {
    console.error(error);
    alert("Error processing round");
    return;
  }

  alert("Round processed successfully");
}
</script>

</body>
</html>
