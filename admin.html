<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>March Madness Admin</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #1f2937;
      padding: 40px;
      border-radius: 12px;
      width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
      color: #facc15;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      background: #dc2626;
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: #b91c1c;
    }

    button:disabled {
      background: gray;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
    }

    .success { color: #22c55e; }
    .error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🏀 Admin Panel</h1>

    <input
      id="roundNumber"
      type="number"
      placeholder="Enter Round Number (1,2,3...)"
      min="1"
    />

    <button id="advanceBtn">
      Advance Round
    </button>

    <p id="status"></p>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://vlyrdolffrcpaaszjdtv.supabase.co",
      "sb_publishable_N3lv1OFRTCeRhmuyRMzbAg_D-_mPxPs"
    );

    const button = document.getElementById("advanceBtn");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {

      const round = parseInt(document.getElementById("roundNumber").value);

      if (!round || round < 1) {
        status.className = "error";
        status.innerText = "Please enter a valid round number.";
        return;
      }

      button.disabled = true;
      status.className = "";
      status.innerText = "Processing round...";

      const { error } = await supabase.rpc("process_round", {
        p_round: round
      });

      if (error) {
        status.className = "error";
        status.innerText = error.message;
        button.disabled = false;
        return;
      }

      status.className = "success";
      status.innerText = `Round ${round} processed successfully.`;

      // Optional: Auto refresh leaderboard page
      // window.open('/leaderboard.html', '_blank');

      button.disabled = false;
    });
  </script>

</body>
</html>
