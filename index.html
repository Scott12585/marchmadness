<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>

  <h2>Admin Login</h2>

  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <button id="loginBtn">Login</button>

  <div id="error" style="color:red; margin-top:10px;"></div>

  <!-- Supabase (LOAD ONLY ONCE) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async function () {

      const SUPABASE_URL = "https://vlyrdolffrcpaaszjdtv.supabase.co"
      const SUPABASE_ANON_KEY = "sb_publishable_N3lv1OFRTCeRhmuyRMzbAg_D-_mPxPs"  // your anon key here

      // Create client safely
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      )

      const emailInput = document.getElementById("email")
      const passwordInput = document.getElementById("password")
      const errorDiv = document.getElementById("error")
      const loginBtn = document.getElementById("loginBtn")

      // Login function
      async function login() {
        errorDiv.textContent = ""

        const email = emailInput.value.trim()
        const password = passwordInput.value.trim()

        if (!email || !password) {
          errorDiv.textContent = "Please enter email and password."
          return
        }

        const { error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        })

        if (error) {
          errorDiv.textContent = error.message
          return
        }

        window.location.href = "admin.html"
      }

      // Button listener (cleaner than onclick)
      loginBtn.addEventListener("click", login)

      // Optional: allow Enter key
      passwordInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          login()
        }
      })

      // Auto redirect if already logged in
      const { data } = await supabaseClient.auth.getSession()
      if (data.session) {
        window.location.href = "admin.html"
      }

    })
  </script>

</body>
</html>
