<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>March Madness Pool – Leaderboard</title>
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      max-width: 900px;
      margin: auto;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #222;
      color: white;
    }

    .active {
      color: green;
      font-weight: bold;
    }

    .eliminated {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🏀 March Madness Survivor Leaderboard</h1>

  <table>
    <thead>
      <tr>
        <th>Entrant</th>
        <th>Current Team</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="leaderboard-body">
      <tr>
        <td colspan="3">Loading...</td>
      </tr>
    </tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    const SUPABASE_URL = "https://vlyrdolffrcpaaszjdtv.supabase.co"
    const SUPABASE_ANON_KEY = "sb_publishable_N3lv1OFRTCeRhmuyRMzbAg_D-_mPxPs"

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    )

    async function loadLeaderboard() {
      const { data, error } = await supabaseClient
        .from('entrants')
        .select(`
          id,
          name,
          eliminated,
          teams (
            name
          )
        `)
        .order('eliminated', { ascending: true })
        .order('name', { ascending: true })

      const tableBody = document.getElementById("leaderboard-body")
      tableBody.innerHTML = ""

      if (error) {
        tableBody.innerHTML = "<tr><td colspan='3'>Error loading data</td></tr>"
        console.error(error)
        return
      }

      if (!data.length) {
        tableBody.innerHTML = "<tr><td colspan='3'>No entrants found</td></tr>"
        return
      }

      data.forEach(entry => {
        const row = document.createElement("tr")

        const teamName = entry.teams ? entry.teams.name : "-"

        row.innerHTML = `
          <td>${entry.name}</td>
          <td>${teamName}</td>
         <td class="${entry.is_alive ? 'active' : 'eliminated'}">
  	  ${entry.is_alive ? 'Active' : 'Eliminated'}
	</td>
        `

        tableBody.appendChild(row)
      })
    }

    loadLeaderboard()
  </script>

</body>
</html>
