<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Leaderboard</title>
</head>
<body>

<h1>Leaderboard</h1>
<div id="leaderboard">Loading...</div>

<!-- Load Supabase ONCE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener("DOMContentLoaded", async function () {

  const SUPABASE_URL = "https://vlyrdolffrcpaaszjdtv.supabase.co"
  const SUPABASE_ANON_KEY = "sb_publishable_N3lv1OFRTCeRhmuyRMzbAg_D-_mPxPs"

  // CREATE CLIENT ONCE
  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  )

  async function loadLeaderboard() {

    const { data, error } = await supabaseClient
      .from("entrants")
      .select("id, name, is_alive")
      .order("is_alive", { ascending: false })
      .order("name", { ascending: true })

    if (error) {
      console.error(error)
      document.getElementById("leaderboard").innerText =
        "Error loading data"
      return
    }

    const container = document.getElementById("leaderboard")
    container.innerHTML = ""

    data.forEach(entry => {
      const row = document.createElement("div")
      row.innerHTML = `
        <strong>${entry.name}</strong> -
        ${entry.is_alive ? "🟢 Alive" : "🔴 Eliminated"}
      `
      container.appendChild(row)
    })
  }

  loadLeaderboard()

})
</script>

</body>
</html>
