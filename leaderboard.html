<!DOCTYPE html>
<html>
<head>
  <title>March Madness Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 36px;
      color: #facc15;
    }

    .counts {
      margin: 20px;
      font-size: 18px;
    }

    .section {
      margin: 40px auto;
      max-width: 600px;
    }

    .section h2 {
      border-bottom: 2px solid #facc15;
      padding-bottom: 10px;
    }

    .card {
      background: #1f2937;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
    }

    .alive {
      border-left: 6px solid #22c55e;
    }

    .eliminated {
      border-left: 6px solid #ef4444;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<h1>🏀 March Madness Leaderboard</h1>

<div class="counts">
  <span id="aliveCount"></span> |
  <span id="eliminatedCount"></span>
</div>

<div class="section">
  <h2>🔥 Still Alive</h2>
  <div id="aliveList"></div>
</div>

<div class="section">
  <h2>💀 Eliminated</h2>
  <div id="eliminatedList"></div>
</div>

<script>
const supabaseUrl = "https://vlyrdolffrcpaaszjdtv.supabase.co";
const supabaseKey = "sb_publishable_N3lv1OFRTCeRhmuyRMzbAg_D-_mPxPs"; // replace this
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function loadLeaderboard() {

  const { data, error } = await supabase
    .from("team_ownership")
    .select(`
      entrant_id,
      entrants (
        name,
        is_alive
      ),
      teams (
        name
      )
    `);

  if (error) {
    console.error(error);
    return;
  }

  const alive = [];
  const eliminated = [];

  data.forEach(row => {

    if (!row.entrants) return;

    const entry = {
      name: row.entrants.name,
      team: row.teams ? row.teams.name : "—",
      is_alive: row.entrants.is_alive
    };

    if (entry.is_alive) {
      alive.push(entry);
    } else {
      eliminated.push(entry);
    }

  });

  renderSection("aliveList", alive, "alive");
  renderSection("eliminatedList", eliminated, "eliminated");

  document.getElementById("aliveCount").innerText =
    `Alive: ${alive.length}`;

  document.getElementById("eliminatedCount").innerText =
    `Eliminated: ${eliminated.length}`;
}

function renderSection(elementId, list, cssClass) {

  const container = document.getElementById(elementId);
  container.innerHTML = "";

  list.sort((a, b) => a.name.localeCompare(b.name));

  list.forEach(entry => {
    container.innerHTML += `
      <div class="card ${cssClass}">
        <span>${entry.name}</span>
        <span>${entry.team}</span>
      </div>
    `;
  });
}

loadLeaderboard();

// 🔄 Auto refresh every 30 seconds
setInterval(loadLeaderboard, 30000);

</script>

</body>
</html>
